<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHub - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 420px;
            background: white;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #1877c9;
            font-size: 42px;
        }

        h2 {
            margin: 15px 0 30px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1877c9;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #16a9d9;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #118fba;
        }

        #message {
            margin-top: 15px;
            min-height: 22px;
            font-size: 15px;
        }

        .register {
            margin-top: 25px;
            font-size: 16px;
        }

        .register a {
            color: #16a9d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ConnectHub</h1>
    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000/api";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    message.style.color = "blue";
    message.innerText = "Logging in...";

    try {

        const response = await fetch("http://127.0.0.1:8000/login/", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        username: username,
        password: password
    })
})
            }
        );

        const data = await response.json();

        if (response.ok) {

            localStorage.setItem(
                "access_token",
                data.access
            );

            localStorage.setItem(
                "refresh_token",
                data.refresh
            );

            localStorage.setItem(
                "username",
                data.user.username
            );

            localStorage.setItem(
                "user_id",
                data.user.id
            );

            message.style.color = "green";
            message.innerText = "Login successful!";

            setTimeout(function() {
                window.location.href = "index.html";
            }, 700);

        } else {

            message.style.color = "red";
            message.innerText =
                data.error || "Invalid username or password.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerText =
            "Cannot connect to Django server.";
    }

});

</script>

</body>
</html>
