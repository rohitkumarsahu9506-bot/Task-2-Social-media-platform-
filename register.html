<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConnectHub - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #087fc1;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #078bd0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #056fa8;
        }

        .message {
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
        }

        .bottom a {
            color: #078bd0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">ConnectHub</div>

    <h2>Create Account</h2>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000/api";


document.getElementById("registerForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");


        if (password !== confirmPassword) {

            message.style.color = "red";
            message.innerText = "Passwords do not match.";

            return;
        }


        try {

            const response = await fetch(
                `${API_URL}/register/`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                message.style.color = "green";

                message.innerText =
                    "Registration successful! Redirecting...";

                setTimeout(() => {

                    window.location.href = "login.html";

                }, 1200);

            } else {

                message.style.color = "red";

                message.innerText =
                    data.error || "Registration failed.";

            }

        } catch (error) {

            message.style.color = "red";

            message.innerText =
                "Django server is not running.";

        }

    }
);

</script>

</body>
</html>
